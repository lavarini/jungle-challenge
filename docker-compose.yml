name: wagering

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-only
      POSTGRES_DB: postgres
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
      # Tokens carry this issuer whether fetched from the host or from a container.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./deploy/keycloak/realm-wagering.json:/opt/keycloak/data/import/realm-wagering.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      # The image ships no curl; bash talks to the management port directly.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  localstack:
    image: localstack/localstack:4.7.0
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./deploy/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wallet-events-audit.fifo > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    build: .
    image: wagerd:local
    command: ["migrate", "up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://wager_migrator:migrator-dev-only@postgres:5432/wagering?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app: &app
    image: wagerd:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment: &app-env
      WAGERD_ROLE: all
      HTTP_ADDR: ":8080"
      # Metrics, pprof and worker readiness; deliberately not in `ports`.
      ADMIN_ADDR: ":9090"
      # Keep serving 503 for 5 s before draining so a balancer stops routing.
      SHUTDOWN_READINESS_DELAY: 5s
      DATABASE_URL: postgres://wager_app:app-dev-only@postgres:5432/wagering?sslmode=disable
      OIDC_ISSUER_URL: http://localhost:8081/realms/wagering
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/wagering
      OIDC_AUDIENCE: wagering-api
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_SENDER_PROVIDERS: "111111111111=provider-a,222222222222=provider-b"
      SNS_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:wallet-events.fifo
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  app2:
    <<: *app
    profiles: [multi]
    ports:
      - "127.0.0.1:8082:8080"

  app3:
    <<: *app
    profiles: [multi]
    ports:
      - "127.0.0.1:8083:8080"

volumes:
  pgdata:
