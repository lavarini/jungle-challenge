name: wagering

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-only
      POSTGRES_DB: postgres
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
      # Tokens carry this issuer whether fetched from the host or from a container.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./deploy/keycloak/realm-wagering.json:/opt/keycloak/data/import/realm-wagering.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      # The image ships no curl; bash talks to the management port directly.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  localstack:
    image: localstack/localstack:4.7.0
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./deploy/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wallet-events-audit.fifo > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  pgdata:
